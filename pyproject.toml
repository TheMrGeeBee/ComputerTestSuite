[project]
name = "computertestsuite"
version = "1.2.0"
description = "Bootable Linux hardware stress-test suite: CPU, RAM, storage, GPU, network, USB"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "TheMrGeeBee", email = "mrgeebee@pm.me" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
computertestsuite = "computertestsuite:main"
cts = "computertestsuite:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
